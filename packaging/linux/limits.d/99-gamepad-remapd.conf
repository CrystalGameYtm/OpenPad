# Дозволяє потоку-читачу демона використовувати планувальник реального часу (SCHED_FIFO),
# що прибирає «хвіст» затримок, коли система навантажена (збірка, гра, відеокодування).
#
# Установка: sudo cp 99-gamepad-remapd.conf /etc/security/limits.d/   і ПЕРЕЛОГІНЬТЕСЬ.
# Користувач має бути в групі input.
#
# ⚠ Безпека: rtprio надає потокам користувача пріоритет над ВСІМА звичайними процесами.
# Значення 95 — стеля; демон просить лише realtime_priority (50) і лише для одного потоку.
# PAM застосовує ці ліміти й до користувацького менеджера systemd, тож сервіс їх успадковує.
@input  -  rtprio  95
@input  -  nice    -10
