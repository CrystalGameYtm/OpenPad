[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepad-remapd"
version = "0.1.0"
description = "Асинхронний ремапер геймпадів (hidraw/hidapi -> uinput/ViGEm) із Web UI та затримкою обробки < 1.5 мс"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Ядро на Linux не має залежностей: hidraw/uinput/ioctl реалізовано на stdlib.
dependencies = []

[project.optional-dependencies]
web = ["aiohttp>=3.9"]
hidapi = ["hidapi>=0.14"]                       # Windows або резервний backend на Linux
windows = ["aiohttp>=3.9", "hidapi>=0.14", "vgamepad>=0.1"]
speed = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
gamepad-remapd = "gamepad_remapd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamepad_remapd = ["layouts/*.json", "profiles/*.json", "handshakes/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
