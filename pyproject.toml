[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepad-remapd"
version = "0.2.0"
description = "Async gamepad remapper (hidraw/hidapi -> uinput/ViGEm) with a Web UI and processing latency < 1.5 ms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
web = ["aiohttp>=3.9"]
hidapi = ["hidapi>=0.14"]                       # Windows, or a fallback backend on Linux
windows = ["aiohttp>=3.9", "hidapi>=0.14", "vgamepad>=0.1"]
speed = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
gamepad-remapd = "gamepad_remapd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamepad_remapd = ["layouts/*.json", "profiles/*.json", "keymaps/*.json", "handshakes/*.json", "web/static/*", "web/static/locales/*.json", "messages/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
